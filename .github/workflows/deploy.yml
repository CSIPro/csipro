name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/lint.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Generate .env file
        env:
          ENV_VARS: ${{ secrets.ENV_VARS }}
        run: |
          echo "$ENV_VARS" > .env.local

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          BRIDGE_HOSTNAME: ${{ secrets.BRIDGE_HOSTNAME }}
          PRODUCTION_HOSTNAME: ${{ secrets.PRODUCTION_HOSTNAME }}
          DEPLOY_USERNAME: ${{ secrets.DEPLOY_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo -e "Host unison-bridge\n\tHostName $BRIDGE_HOSTNAME\n\tUser $DEPLOY_USERNAME\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" > ~/.ssh/config
          echo -e "Host unison-production\n\tHostName $PRODUCTION_HOSTNAME\n\tUser $DEPLOY_USERNAME\n\tProxyJump unison-bridge\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Transfer files to Production
        run: |
          rsync -rvz --delete --exclude=".git" --exclude="node_modules" --exclude=".next" ./ unison-production:/var/www/csipro.isi.unison.mx/

      - name: SSH to Production and install dependencies
        run: ssh unison-production "bash -i -c 'cd /var/www/csipro.isi.unison.mx && pnpm install --frozen-lockfile && pnpm build && pm2 reload csipro.isi.unison.mx'"
